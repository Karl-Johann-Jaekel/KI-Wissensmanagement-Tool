name: CI

# The browser E2E stays out of CI on purpose: it builds the whole stack including the ~470 MB
# embedding model. It runs locally before a release, see README → "Browser-E2E".

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: notebook
          POSTGRES_PASSWORD: notebook
          POSTGRES_DB: notebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebook -d notebook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # The test suite creates and migrates "<db>_test" next to this database.
      DATABASE_URL: postgresql+psycopg://notebook:notebook@localhost:5432/notebook

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      # Tests use a fake embedder and a fake LLM, so no model download and no external API.
      # -rs prints why a test was skipped: test_embed needs the 470 MB model that the project
      # image pre-downloads, which is not worth fetching on every CI run.
      - run: pytest -q -rs

  frontend:
    name: Frontend (build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
